<script type="text/plain" id="rt">
// ADNAMI CLICK TRACKING MACRO - DO NOT MODIFY //
const clickTagPrefix = "${CLICK_URL}",
clickURL = (window.adnmClick) ? window.adnmClick : "__CLICK__",
clickElement = document.getElementById("banner") || document.body;

if (clickElement) {
	clickElement.addEventListener("click", function(e){
		const exitUrl = clickTagPrefix + clickURL;
		window.open(exitUrl, '_blank');
	})
}

const REVEAL_DISTANCE = __DIST__;
const REVEAL_DIRECTION = "up";
const REVEAL_GAP = __GAP__;
const INTRO_DURATION = 1.8;
const OUTRO_DURATION = 1.8;

function alignProgressBars() {
	const r = document.getElementById("banner");
	document.querySelectorAll(".progressBar[data-align]").forEach(b => {
		const t = document.querySelector(b.dataset.align);
		if (t && r) b.style.setProperty("--y", (t.getBoundingClientRect().top - r.getBoundingClientRect().top) + "px");
	});
}

function playProgressBars() {
	document.querySelectorAll(".progressBar").forEach(bar => {
		const st = getComputedStyle(bar);
		const d = readNum(st, "--delay", 0), dur = readNum(st, "--dur", 0);
		const outro = readNum(st, "--outro", 0) === 1, od = readNum(st, "--outro-duration", 1.8);
		const starts = [d];
		if (outro) starts.push(d + dur - od);
		const rect = bar.querySelector(".rectangle");
		if (!rect) return;
		rect.style.animation = starts.map(x => `probarAnimation 1.8s linear ${x}s 1 normal forwards`).join(", ");
		bar.querySelectorAll(".face").forEach(f => { f.style.animation = starts.map(x => `backFace 1.4s linear ${x}s forwards`).join(", "); });
	});
}

const DIR_VECTORS = {
	up:    (d) => ["0px", d + "px"],
	down:  (d) => ["0px", -d + "px"],
	right: (d) => [-d + "px", "0px"],
	left:  (d) => [d + "px", "0px"],
	dissolve: () => ["0px", "0px"],
};

function readNum(style, name, fallback) {
	const v = style.getPropertyValue(name).trim();
	if (v === "") return fallback;
	const n = parseFloat(v);
	return Number.isNaN(n) ? fallback : n;
}

function applyTiming(el, introStart, introDuration, outroDuration, introEnabled, outroEnabled, totalDuration, outroLead = 0, inName = "DanskeBankIn", outName = "DanskeBankOut") {
	const parts = [];
	if (introEnabled && introDuration > 0) {
		parts.push(`${inName} ${introDuration}s ease-in-out ${introStart}s forwards`);
	} else {
		el.style.opacity = "1";
		el.style.transform = "translate(0,0)";
	}
	if (outroEnabled && outroDuration > 0) {
		const outroStart = introStart + totalDuration - outroDuration - outroLead;
		parts.push(`${outName} ${outroDuration}s ease-in-out ${outroStart}s forwards`);
	}
	if (parts.length) el.style.animation = parts.join(", ");
}

function reveal(el) {
	const style = getComputedStyle(el);
	const baseDelay      = readNum(style, "--delay", parseFloat(style.animationDelay) || 0);
	const totalDuration  = readNum(style, "--dur", parseFloat(style.animationDuration) || 0);
	const introDuration  = readNum(style, "--intro-duration", INTRO_DURATION);
	const outroDuration  = readNum(style, "--outro-duration", OUTRO_DURATION);
	const introEnabled   = readNum(style, "--intro", 1) === 1;
	const outroEnabled   = readNum(style, "--outro", 0) === 1;
	const direction = el.dataset.direction || REVEAL_DIRECTION;
	const dirOut = el.dataset.directionOut || direction;
	const inName = direction === "dissolve" ? "DBFadeIn" : "DanskeBankIn";
	const outName = dirOut === "dissolve" ? "DBFadeOut" : "DanskeBankOut";
	const [tx, ty]       = DIR_VECTORS[direction](REVEAL_DISTANCE);
	const [txOut, tyOut] = DIR_VECTORS[dirOut](-REVEAL_DISTANCE);

	if (el.hasAttribute("data-lines")) {
		const toks = [];
		(function walk(node, anc) {
			node.childNodes.forEach(c => {
				if (c.nodeType === 3) c.textContent.split(/\s+/).filter(Boolean).forEach(w => toks.push({ w, anc }));
				else if (c.nodeName === "BR") toks.push({ br: 1 });
				else if (c.nodeType === 1) walk(c, anc.concat(c));
			});
		})(el, []);
		el.innerHTML = "";
		toks.forEach(k => {
			if (k.br) { el.appendChild(document.createElement("br")); return; }
			const span = document.createElement("span");
			span.className = "word";
			let host = span;
			k.anc.forEach(a => { const n = a.cloneNode(false); host.appendChild(n); host = n; });
			host.appendChild(document.createTextNode(k.w + " "));
			el.appendChild(span);
		});
		const rows = [];
		let cur = null;
		el.querySelectorAll(".word").forEach((w) => {
			const r = w.getBoundingClientRect(), c = (r.top + r.bottom) / 2;
			if (!cur || c > cur.b) { cur = { b: r.bottom, w: [] }; rows.push(cur.w); }
			cur.b = Math.max(cur.b, r.bottom);
			cur.w.push(w);
		});
		el.innerHTML = "";
		const staggerSpan = (rows.length - 1) * REVEAL_GAP;
		rows.forEach((words, i) => {
			const line = document.createElement("div");
			line.className = "line";
			words.forEach(w => line.appendChild(w));
			line.style.setProperty("--tx-from", tx);
			line.style.setProperty("--ty-from", ty);
			line.style.setProperty("--tx-to", txOut);
			line.style.setProperty("--ty-to", tyOut);
			applyTiming(line, baseDelay + i * REVEAL_GAP, introDuration, outroDuration, introEnabled, outroEnabled, totalDuration, staggerSpan, inName, outName);
			el.appendChild(line);
		});
		el.style.opacity = "1";
	} else {
		el.style.setProperty("--tx-from", tx);
		el.style.setProperty("--ty-from", ty);
		el.style.setProperty("--tx-to", txOut);
		el.style.setProperty("--ty-to", tyOut);
		applyTiming(el, baseDelay, introDuration, outroDuration, introEnabled, outroEnabled, totalDuration, 0, inName, outName);
	}
}

const LOOP_N = __LOOPN__, LOOP_X = __LOOPX__, TOTAL = __TOTAL__;
function startLoop() {
	if (window.BS_EDIT) return;
	let pass = 1;
	const all = () => document.getAnimations();
	const restart = () => all().forEach(a => { a.currentTime = 0; a.play(); });
	const freezeAt = (sec) => all().forEach(a => { a.currentTime = sec * 1000; a.pause(); });
	function run(len) {
		setTimeout(() => {
			if (LOOP_N === 0 || pass < LOOP_N) { pass++; restart(); run(TOTAL); }
			else if (pass === LOOP_N && LOOP_X > 0 && LOOP_X < TOTAL) { pass++; restart(); setTimeout(() => freezeAt(LOOP_X), LOOP_X * 1000); }
			else freezeAt(TOTAL);
		}, len * 1000);
	}
	run(TOTAL);
}

document.fonts.ready.then(() => {
	document.querySelectorAll("[data-reveal]").forEach(reveal);
	alignProgressBars();
	playProgressBars();
	startLoop();
});
window.addEventListener("resize", alignProgressBars);
</script>

<script type="text/plain" id="bcss">
:root{--padding:calc((100vw / 64) *6);--1c:calc(100vw / 64);--easing:cubic-bezier(0.7, 0, 0.2, 1);--db-dark:__BG__}
@font-face{font-family:"__FONT__";src:url("__FONTURL__") format("woff2");font-weight:normal;font-style:normal}
*,*::before,*::after{margin:0;border:0;padding:0;box-sizing:border-box;font-family:"__FONT__",arial,sans-serif}
html,body{height:100%;cursor:pointer;background-color:var(--db-dark);overflow:hidden}
body{position:relative}
.el{position:absolute}
.line,.rv{opacity:0}
.img img{display:block;width:100%}
.text{text-align:center}
.ctaw{display:flex;justify-content:center}
.cta{display:flex;justify-content:center;align-items:center;overflow:hidden;white-space:nowrap;width:100%;padding:0.7em 1.2em;opacity:0;transform-origin:center;animation:ctaExpand 1.6s var(--easing) forwards}
.cta-text{display:inline-block;opacity:0;animation:ctaTextFade 1.4s var(--easing) forwards}
@keyframes ctaExpand{from{opacity:0;transform:translate(0px,24px);width:0em}to{opacity:1;transform:translate(0px,0px);width:100%}}
@keyframes ctaTextFade{from{transform:translate(0px,10px);opacity:0}to{transform:translate(0px,0px);opacity:1}}
@keyframes DanskeBankIn{0%{opacity:0;transform:translate(var(--tx-from,0px),var(--ty-from,30px))}25%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}
@keyframes DanskeBankOut{0%{opacity:1;transform:translate(0,0)}75%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--tx-to,0px),var(--ty-to,-30px))}}
.progressBar{display:flex;justify-content:center;transform-style:preserve-3d;top:var(--y)}
@keyframes probarFade{0%{opacity:1}60%{opacity:1}100%{opacity:0}}
.rectangle{--cube-w:calc(var(--1c) * var(--bar-cols) * 0.7071);--cube-z:calc(var(--cube-w) / 2);--full-w:calc(var(--1c) * var(--bar-cols));--ratio-inv:0.235792;width:var(--cube-w);height:calc(var(--full-w) * var(--ratio-inv));position:relative;transform-style:preserve-3d;transform-origin:center}
.face{position:absolute;width:100%;height:100%;transform-style:preserve-3d;backface-visibility:hidden}
.face.a{background-color:var(--ca)}.face.b{background-color:var(--cb)}
.face:nth-child(1){transform:rotateY(0deg) translateZ(var(--cube-z)) scale(1.01)}
.face:nth-child(2){transform:rotateY(90deg) translateZ(var(--cube-z)) scale(1.01)}
.face:nth-child(3){transform:rotateY(180deg) translateZ(var(--cube-z)) scale(1.01)}
.face:nth-child(4){transform:rotateY(270deg) translateZ(var(--cube-z)) scale(1.01)}
@keyframes probarAnimation{0%{transform:rotateY(-30deg) translate3d(-0.025em,0px,0px);animation-timing-function:cubic-bezier(0.5,0,1,0.8)}40%{transform:rotateY(10deg);animation-timing-function:linear}50%{transform:rotateY(60deg);animation-timing-function:linear}60%{transform:rotateY(95deg);animation-timing-function:step-start}61%{transform:rotateY(100deg);animation-timing-function:step-end}63%{transform:rotateY(105deg);animation-timing-function:linear}70%{transform:rotateY(120deg);animation-timing-function:cubic-bezier(0.33,1,0.68,1)}100%{transform:rotateY(150deg);animation-timing-function:linear}}
@keyframes backFace{0%{backface-visibility:visible}50%{backface-visibility:visible}100%{backface-visibility:hidden}}
@keyframes DBFadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes DBFadeOut{0%{opacity:1}100%{opacity:0}}
@keyframes ctaFadeIn{from{opacity:0}to{opacity:1}}
@keyframes ctaFadeOut{from{opacity:1}to{opacity:0}}
@keyframes ctaWipeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes ctaWipeOut{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 100%)}}
@keyframes ctaExpandOut{from{opacity:1;transform:translate(0px,0px);width:100%}to{opacity:0;transform:translate(0px,-24px);width:0em}}
@keyframes ctaTextFadeOut{from{opacity:1}to{opacity:0}}
</script>

function kfObjs(){const L=selKfs.length?selKfs:(selKf?[selKf]:[]),out=[];L.forEach(it=>{const e=byId(it.id),a=e&&e.k&&e.k[it.key],z=a&&a.find(q=>Math.abs(q.t-it.t)<.03);if(z)out.push({e,key:it.key,z,it})});return out}
const kfSelHas=(id,key,tm)=>selKfs.some(q=>q.id==id&&q.key==key&&Math.abs(q.t-tm)<.03);
function applyEase(kind){const L=kfObjs();if(!L.length)return;L.forEach(({e,key,z})=>{const a=e.k[key].slice().sort((x,y)=>x.t-y.t),Pv=a[a.indexOf(z)-1],set=(q,fn)=>{const c=(bz4(q.ease)||[0,0,1,1]).slice();fn(c);q.ease=bzS(c)};
  if(kind=='both'||kind=='out')set(z,c=>{c[0]=.33;c[1]=0});if((kind=='both'||kind=='in')&&Pv)set(Pv,c=>{c[2]=.67;c[3]=1})});renderTL();renderProps();refresh()}
function copyKfs(){const L=kfObjs();if(!L.length)return toast('Select keyframes first');const t0=Math.min(...L.map(o=>o.z.t));kfClip={items:L.map(o=>({key:o.key,dt:R(o.z.t-t0),data:JSON.parse(JSON.stringify(o.z))}))};toast(L.length+' keyframe'+(L.length>1?'s':'')+' copied')}
function pasteKfs(){if(!kfClip)return toast('Nothing to paste');const tg=[...selSet].map(byId).filter(Boolean);if(!tg.length)return toast('Select a layer to paste into');let n=0;
 tg.forEach(e=>kfClip.items.forEach(it=>{if(!kSupp(e,it.key))return;e.k=e.k||{};const a=e.k[it.key]=e.k[it.key]||[],tm=R(t+it.dt);if(tm>P.total)return;const i=a.findIndex(z=>Math.abs(z.t-tm)<.03);if(i>=0)a.splice(i,1);const z=JSON.parse(JSON.stringify(it.data));z.t=tm;a.push(z);a.sort((x,y)=>x.t-y.t);(kfShow[e.id]=kfShow[e.id]||new Set()).add(it.key);n++}));
 toast(n?n+' keyframe'+(n>1?'s':'')+' pasted at '+t.toFixed(1)+'s':'These properties are not supported by the selected layer');renderTL();renderProps();refresh()}
function startMarquee(ev){const rl=document.querySelector('#tlb .rl');if(!rl)return;const x0=ev.clientX,y0=ev.clientY,add=ev.shiftKey||ev.ctrlKey||ev.metaKey,mq=document.createElement('div');mq.className='mq';rl.appendChild(mq);const base=add?selKfs.slice():[];let moved=false;
 const box=m=>({l:Math.min(x0,m.clientX),r:Math.max(x0,m.clientX),t:Math.min(y0,m.clientY),b:Math.max(y0,m.clientY)}),hit=(d,b)=>{const r=d.getBoundingClientRect();return r.right>=b.l&&r.left<=b.r&&r.bottom>=b.t&&r.top<=b.b};
 const mv=m=>{if(!moved&&Math.hypot(m.clientX-x0,m.clientY-y0)<4)return;moved=true;const b=box(m),rr=rl.getBoundingClientRect();mq.style.cssText='left:'+(b.l-rr.left)+'px;top:'+(b.t-rr.top)+'px;width:'+(b.r-b.l)+'px;height:'+(b.b-b.t)+'px';
  document.querySelectorAll('#tlb .kfd').forEach(d=>d.classList.toggle('on',hit(d,b)||base.some(q=>q.id==d.dataset.id&&q.key==d.dataset.key&&Math.abs(q.t-d.dataset.t)<.03)))};
 const up=m=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);mq.remove();
  if(!moved){if(!add){selKfs=[];selKf=null}const row=ev.target.closest('.trow');if(row&&row.dataset.id&&!selSet.has(row.dataset.id))select(row.dataset.id);else{renderTL();renderProps()}return}
  const b=box(m),merged=base.slice();document.querySelectorAll('#tlb .kfd').forEach(d=>{if(hit(d,b)){const g={id:d.dataset.id,key:d.dataset.key,t:+d.dataset.t};if(!merged.some(q=>q.id==g.id&&q.key==g.key&&Math.abs(q.t-g.t)<.03))merged.push(g)}});
  const last=merged[merged.length-1];if(last&&sel!=last.id)select(last.id);selKfs=merged;selKf=last||null;renderTL();renderProps()};
 addEventListener('mousemove',mv);addEventListener('mouseup',up)}
$('#tlb').addEventListener('contextmenu',ev=>{ev.preventDefault();hideCtx();const kdn=ev.target.closest('.kfd'),kl=ev.target.closest('.kfl'),row=ev.target.closest('.trow');if(!row||!row.dataset.id)return;const e=byId(row.dataset.id);if(!e)return;
 const redo2=()=>{renderTL();renderProps();refresh()};
 const easeItems=(key,title)=>[{head:title}].concat(EPRE.map(([n,v])=>({label:n,on:(selKfObj()||{}).ease==v,fn:()=>{kfObjs().forEach(o=>o.z.ease=v);redo2()}})),[{sep:1}],EAE.map(([n,kd,sc])=>({label:n,kb:sc.replace('Ctrl+Shift+','^⇧').replace('Shift+','⇧'),fn:()=>applyEase(kd)})),[{label:'Custom…',fn:()=>{renderTL();renderProps()}}]);
 if(kdn||kl){const el=kdn||kl,key=el.dataset.key,tm=+el.dataset.t;if(sel!=e.id)select(e.id);if(!kfSelHas(e.id,key,tm)){selKfs=[{id:e.id,key,t:tm}]}selKf=selKfs.find(q=>q.id==e.id&&q.key==key&&Math.abs(q.t-tm)<.03);renderTL();renderProps();
  const items=easeItems(key,kdn?'Easing after keyframe':'Easing between keyframes');items.push({sep:1},{label:'Copy keyframes',kb:'Ctrl+C',fn:copyKfs});if(kfClip)items.push({label:'Paste keyframes',kb:'Ctrl+V',fn:pasteKfs});
  items.push({sep:1},{label:'Delete keyframes',kb:'Del',fn:()=>{kfObjs().forEach(o=>{o.e.k[o.key]=o.e.k[o.key].filter(z=>z!==o.z)});selKf=null;selKfs=[];redo2()}});showCtx(ev.clientX,ev.clientY,items);return}
 const prow=ev.target.closest('.prow');
 if(prow){const key=prow.dataset.key,r=prow.querySelector('.trk').getBoundingClientRect(),tm=Math.max(0,Math.min(P.total,snp((ev.clientX-r.left)/pps)));select(e.id);const it=[{head:KL[key]},{label:'Add keyframe here ('+tm.toFixed(1)+'s)',fn:()=>{setK(e,key,tm,{});redo2()}},{label:'Add keyframe at playhead',fn:()=>{setK(e,key,t,{});redo2()}}];if(kfClip)it.push({sep:1},{label:'Paste keyframes',kb:'Ctrl+V',fn:pasteKfs});showCtx(ev.clientX,ev.clientY,it);return}
 select(e.id);const it=[{head:'Thêm keyframe'}].concat(KEYS.filter(k=>kSupp(e,k)).map(k=>({label:KL[k],kb:KB[k],fn:()=>{setK(e,k,t,{});(kfShow[e.id]=kfShow[e.id]||new Set()).add(k);redo2()}})),[{sep:1},{label:'Hiện keyframe',kb:'U',fn:()=>{uOff.delete(e.id);uSet.add(e.id);renderTL();renderProps()}},{label:'Ẩn keyframe',kb:'UU',fn:()=>{delete kfShow[e.id];uSet.delete(e.id);uOff.add(e.id);renderTL();renderProps()}}]);
 if(kfClip)it.push({sep:1},{label:'Paste keyframes',kb:'Ctrl+V',fn:pasteKfs});showCtx(ev.clientX,ev.clientY,it)});

/* ---------- boot ---------- */
function migrate(p){p.comments=p.comments||[];p.loop=p.loop||'0';p.gone={};p.xc=p.xc||'';
 if((p.v||0)<3){const fa=p.assets.font;p.cb=fmtCSS(BC.replace(/__BG__/g,p.bg).replace(/__FONT__/g,p.font).replace('__FONTURL__','src/'+(fa?fn(fa):'font.woff2')).trim());p.js=initJS();
  p.els.forEach(e=>{e.kf=e.kf||[];if(e.type=='text')e.text=esc(e.text||'').replace(/\n/g,'<br>');
   if(e.type=='progress'){e.delay=(e.delays&&e.delays[0])||0;e.dur=p.total||6;e.outro=0;e.outroD=1.8;if(!e.kf.length)e.kf=[{t:e.delay,o:1,x:0,y:R((e.run||30)*p.H/p.W),s:1,r:0,ease:'cubic-bezier(0.7,0,0.2,1)'},{t:R(e.delay+1.8),o:1,x:0,y:0,s:1,r:0,ease:'ease'}];delete e.run;delete e.delays}
   else{if(e.type=='cta')e.introD=1.6;e.dur=Math.max(.2,R((p.total||6)-(e.delay||0)))}});p.v=3}
 else{if(!p.cb||!p.js){const d=danske();p.cb=p.cb||d.cb;p.js=p.js||d.js}p.els.forEach(e=>{e.kf=e.kf||[]})}
 if((p.v||0)<4){p.cb=fmtCSS(p.cb);p.js=fmtJS(p.js);p.v=4}
 if((p.v||0)<5){p.els.forEach(mig);if(p.assets.font&&p.assets.font.name=='Danske-Regular.woff2'&&!p.assets.f300){['f300','f500','f700'].forEach(id=>p.assets[id]=JSON.parse(JSON.stringify(DEF[id])));p.cb=fwIns(p.cb,p.font,p.assets)}p.v=5}
 if((p.v||0)<6){p.js=p.js.replace(/ \+ \(outro \? `, probarFade[^`]*` : ""\)/,'');p.v=6}
 if((p.v||0)<7){p.js=initJS();if(!/@keyframes DBFadeIn/.test(p.cb))p.cb=p.cb.trimEnd()+'\n\n'+fmtCSS(NEWKF);p.els.forEach(e=>{e.dirO=e.dirO||e.dir||'up';if(e.type=='cta'){e.intro=1;e.dir='expand';e.dirO='expand';e.outro=e.outro||0;e.outroD=e.outroD||1.8}if(e.type=='shape'){e.sw=e.sw||0;e.sc=e.sc||'#ffffff';if(e.k&&e.k.c){e.k.b=e.k.c;delete e.k.c}}});p.v=7}
 return p}
function loadP(){try{const p=JSON.parse(localStorage.getItem('bs3'));if(p&&p.els&&p.assets)return migrate(p)}catch(_){}return danske()}
function renderAll(r){renderPins();renderProps();renderTL();fit();if(r)refresh()}
function init(){$('#lpi').value=P.loop||'0';renderAll(true)}
addEventListener('resize',()=>{fit();renderTL()});
document.querySelectorAll('[data-ic]').forEach(i=>i.outerHTML=ic(i.dataset.ic));
rsInit();
P=loadP();init();
</script>
